name: Weekly Cold Storage Compaction (>130 days to Parquet)

on:
  schedule:
    # Minggu 21:43 UTC = Senin 04:43 WIB
    - cron: "43 21 * * 0"
  workflow_dispatch:

concurrency:
  group: weather-compact
  cancel-in-progress: false

jobs:
  compact:
    # Jadwal hanya berjalan jika repository variable SCHEDULE_ENABLED bernilai 'true'; jalan manual selalu boleh.
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: etl
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pipeline.compact
