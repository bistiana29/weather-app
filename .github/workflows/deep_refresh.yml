name: Deep Refresh Weather Ingestion (120-day Lookback)

on:
  schedule:
    # 20:33 UTC = 03:33 WIB setiap hari
    - cron: "33 20 * * *"
  workflow_dispatch:

concurrency:
  group: weather-deep-refresh
  cancel-in-progress: false

jobs:
  deep-refresh:
    # Jadwal hanya berjalan jika repository variable SCHEDULE_ENABLED bernilai 'true'; jalan manual selalu boleh.
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: etl
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pipeline.ingest deep_refresh
