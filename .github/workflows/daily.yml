name: Daily Weather Ingestion

on:
  schedule:
    # 00:19, 06:19, 12:19, 18:19 UTC = 07:19, 13:19, 19:19, 01:19 WIB
    - cron: "19 */6 * * *"
  workflow_dispatch:

concurrency:
  group: weather-daily
  cancel-in-progress: false

jobs:
  ingest-daily:
    # Jadwal hanya berjalan jika repository variable SCHEDULE_ENABLED bernilai 'true'; jalan manual selalu boleh.
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: etl
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pipeline.ingest daily
